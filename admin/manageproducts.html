<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage products</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="../assets/js/admin.js"></script>
</head>
<body>
     <header class="site-header">
        <div class="site-title">Clarence's Kitchen</div>
        <div class="header-actions">
            <div class="account-menu">
                <a class="nav-cta account-trigger" href="../login/index.html" aria-label="Account menu">
                    <img src="../assets/images/user.png" alt="">
                    <span>Logout</span>
                </a>
                <!-- <div class="account-dropdown">
                    <a href="../login/index.html">Log In</a>
                    <a href="../signup/index.html">Sign Up</a>
                </div> -->
            </div>
        </div>
    </header>

    <nav class="main-nav" aria-label="Main navigation">
        <ul>
            <li><a href="manageproducts.html">Products</a></li>
            <li><a href="manageorders.html">Orders</a></li>
            <li><a href="managepromo.html">Promo Codes</a></li>
        </ul>
    </nav>

    <main>
        <div>
            <h3>Add Item to Menu:</h3> <br />
            <form id="add-product-form" class="form">
                <input class="form-control" type="text" name="productName" placeholder="Name" required>
                <input class="form-control" type="text" name="productDesc" placeholder="Description" required>
                <input class="form-control" type="number" step="0.01" name="price" placeholder="Price" required>
                <input class="form-control" type="text" name="productClass" placeholder="Category" required>
                <button class="form-control" type="submit">Add Product</button>
            </form>
        </div>

        <h3>Products</h3> <br />
        <div id="product-table"> </div>
    
    </main>
</body>
</html>
