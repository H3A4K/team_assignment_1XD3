<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products | Clarence's Kitchen</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="../assets/js/admin.js" defer></script>
    <script src="../assets/js/global.js" defer></script>
</head>

<body>
    <header class="site-header">
        <a href="../" class="site-title"><img src="../assets/images/logo.png" alt="" class="site-logo">Clarence's Kitchen</a>
        <button class="hamburger" id="hamburger-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="header-actions">
            <div class="account-menu">
                <a class="nav-cta account-trigger" href="../login/" aria-label="Logout">
                    <img src="../assets/images/user.png" alt="">
                    <span>Logout</span>
                </a>
            </div>
        </div>
    </header>

    <nav class="main-nav" id="main-nav" aria-label="Main navigation">
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a class="current" href="manageproducts.html">Products</a></li>
            <li><a href="manageorders.html">Orders</a></li>
            <li><a href="managepromo.html">Promo Codes</a></li>
        </ul>
    </nav>

    <main>
        <h3>Add Item to Menu</h3>
        <form id="add-product-form" class="form">
            <input class="form-control" type="text" name="productName" placeholder="Name" required>
            <input class="form-control" type="text" name="productDesc" placeholder="Description" required>
            <input class="form-control" type="number" step="1.0" name="price" placeholder="Price" required>
            <!-- <input class="form-control" type="text" name="productClass" placeholder="Category" required> -->
            <select class="form-control" id="productClassesSelect">
                <option value="-1">Select product class</option>
            </select>
            <button class="form-control" type="submit">Add Product</button>
            

        </form>

        <h3>Products</h3>
        <div id="product-table"></div>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom">
            <div class="footer-socials">
                <a href="https://www.instagram.com/clarenceskitchen/" target="_blank" rel="noopener" aria-label="Instagram"><img src="../assets/images/instagram.png" alt="Instagram"></a>
                <a href="https://www.facebook.com/ClarencesKitchen/" target="_blank" rel="noopener" aria-label="Facebook"><img src="../assets/images/facebook.png" alt="Facebook"></a>
            </div>
            <p>&copy; 2026 Clarence's Kitchen. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
