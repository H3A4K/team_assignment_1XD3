    <main>
        <div>
            <h3>Add Promo Code</h3> <br />
            <form id="promo-code-form" class="form">
                <input class="form-control" type="text" name="promoCode" placeholder="Promo Code" required>
                <input class="form-control" type="text" name="discountType" placeholder="Discount Type" required> <!-- TODO: change to select -->
                <input class="form-control" type="number" step="0.01" name="discountValue" placeholder="Discount Value" required>
                <input class="form-control" type="number" name="active" placeholder="Select status" required> <!-- TODO: change to select -->
                <input class="form-control" type="text" name="expiryDate" placeholder="Expiry Date" required>
                <button class="form-control" type="submit">Add Promo Code</button>
            </form>
        </div>

        <h3>Promo Codes</h3> <br />
        <div id="promocodes-table"></div>
    </main>
