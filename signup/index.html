<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/signup.css" />
    <script src="../assets/js/signup.js"></script>
  </head>
  <body>
    <header class="site-header">
        <div class="site-title">Clarence's Kitchen</div>
        <div class="header-actions">
            <a class="nav-cta" href="../menu/index.html">Order Now</a>
            <div class="account-menu">
                <a class="nav-cta account-trigger" href="./index.html" aria-label="Account menu">
                    <img src="../assets/images/user.png" alt="">
                    <span>Login/Signup</span>
                </a>
                <div class="account-dropdown">
                    <a href="../login/index.html">Log In</a>
                    <a href="./index.html">Sign Up</a>
                </div>
            </div>
        </div>
    </header>
    <nav class="main-nav" aria-label="Main navigation">
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../menu/index.html">Menu</a></li>
            <li><a href="../catering/index.html">Catering</a></li>
        </ul>
    </nav>
    <div id="content">
      <img src="../assets/images/logo.png" id="logo" />
      <div id="form">
        <!-- <div id="topinputs"> -->
          <div class="inputcontainer">
            <label for="emailinput">Email</label>
            <input
              type="email"
              id="emailinput"
              placeholder="email@example.com"
            />
          </div>
          <div class="inputcontainer">
            <label for="passwordinput">Password</label>
            <input type="password" id="passwordinput" />
          </div>
        <!-- </div> -->
        <!-- <div id="bottominputs"> -->
          <div class="inputcontainer">
            <label for="phoneinput">Phone Number</label>
            <input type="tel" id="phoneinput" placeholder="123-456-7890" />
          </div>
          <div class="inputcontainer">
            <label for="addressinput">Address</label>
            <input
              type="text"
              id="addressinput"
              placeholder="15 Example Drive"
            />
          </div>
        <!-- </div> -->
        <p id="errormessage">Error</p>
        <div id="btns">
          <button id="submitbtn" class="button">Create Account</button>
          <button id="gotologin" class="button">Login instead</button>
        </div>
      </div>
    </div>
  </body>
</html>
